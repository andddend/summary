<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>День пуговиц — Этап 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="stage-badge">Этап 4 из 4</div>
        <div class="image-wrapper">
            <img src="4.png" alt="Задание 4">
        </div>
        <p class="task-text">
            Напишите последовательность чисел, которая получится при прохождении каждого ребра графа.
        </p>
        <div class="form-group">
            <input type="text" id="answerInput" placeholder="Введите последовательность..." autocomplete="off">
            <button onclick="checkAnswer()">Проверить</button>
        </div>
        <div id="feedback" class="message"></div>
    </div>

    <script>
        const VALID_SEQUENCES = new Set([
            "22342423434", "22342434324", "22343242434", "22343243424", "22343423424",
            "22343424324", "22423423434", "22423432434", "22432423434", "22432434324",
            "22434234324", "22434324324", "23422423434", "23422434324", "23423434224",
            "23424223434", "23424343224", "23432242434", "23432243424", "23432422434",
            "23432434224", "23434223424", "23434224324", "23434234224", "23434243224",
            "24223423434", "24223432434", "24234223434", "24234322434", "24243223434",
            "24342234324", "24342343224", "24343223424", "24343224324", "24343243224",
            "42234234342", "42234243432", "42234324342", "42234342432", "42243243432",
            "42243423432", "42243432432", "42342234342", "42342243432", "42342343422",
            "42342434322", "42343224342", "42343243422", "42343422432", "42343423422",
            "42343424322", "42432234342", "42432243432", "42432434322", "42434223432",
            "42434234322", "43422343242", "43422423432", "43423432242", "43423432422",
            "43424223432", "43424234322", "43432234242", "43432242432", "43432243242",
            "43432422432", "43432423422", "43432424322", "43432432242", "43432432422"
        ]);

        function checkAnswer() {
            const userVal = document.getElementById('answerInput').value.replace(/[^0-9]/g, '');
            const feedback = document.getElementById('feedback');

            if (VALID_SEQUENCES.has(userVal)) {
                feedback.className = "message success";
                feedback.innerHTML = '🎉 Поздравляем! Вы успешно прошли все этапы квеста! Часть кода: 6. Сообщите полный код, фамилию, имя и класс охраннику и ожидайте!';
            } else {
                feedback.className = "message error";
                feedback.textContent = "Последовательность неверная. Проверьте маршрут!";
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
